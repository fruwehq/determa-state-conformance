format: 1
namespace: conformance.case_04_defer
events:
  q:
    direction: input
  open:
    direction: input
machines:
  - machine_id: defertest
    version: 1
    root:
      type: composite
      variables:
        seen: {type: int, init: 0}
      initial: {transition_to: closed}
      states:
        closed:
          defer: [q]
          on_events:
            open: {transition_to: ready}
        ready:
          on_events:
            q:
              action: [assign: {seen: "seen + 1"}]       # internal

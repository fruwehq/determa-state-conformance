format: 1
namespace: example.runtime_profile
events:
  submit:
    direction: input
    payload:
      approved:
        type: bool
        required: true
  accepted:
    direction: output
machines:
  - machine_id: order
    root:
      type: composite
      variables:
        accepted:
          type: bool
          init: false
      initial:
        transition_to: pending
      states:
        pending:
          on_events:
            submit:
              - guard: event.payload.approved == true
                action:
                  - assign:
                      accepted: 'true'
              - guard:
                  provider:
                    provider_reference:
                      identifier: example.native-review
                      version: "1.0.0"
                      content_digest:
                        sha256:636e4de6fc36adfe010159165eca945ae71f555f4e7e200d9327161272cffb24
                    source_media_type:
                      application/vnd.determa.runtime-fixture+json
                    source_digest:
                      sha256:6279387a22745dec76ed07d128c8273870fa0b086dad3842fab5f070a3e2c92b
                    dependencies:
                      - identifier: example.native-common
                        version: "1.0.0"
                        content_digest:
                          sha256:636e4de6fc36adfe010159165eca945ae71f555f4e7e200d9327161272cffb24
                    capabilities:
                      deterministic: false
                      pure: false
                      portable: false
                      semantically_introspectable: false
                      process_contained: false
                      external_io_capable: true
                    input_types:
                      event: event_envelope
                      variables: typed_variables
                    output_type: bool
                action:
                  - provider_actions:
                      provider_reference:
                        identifier: example.native-actions
                        version: "1.0.0"
                        content_digest:
                          sha256:636e4de6fc36adfe010159165eca945ae71f555f4e7e200d9327161272cffb24
                      source_media_type:
                        application/vnd.determa.runtime-fixture+json
                      source_digest:
                        sha256:6279387a22745dec76ed07d128c8273870fa0b086dad3842fab5f070a3e2c92b
                      dependencies:
                        - identifier: example.native-common
                          version: "1.0.0"
                          content_digest:
                            sha256:636e4de6fc36adfe010159165eca945ae71f555f4e7e200d9327161272cffb24
                      capabilities:
                        deterministic: false
                        pure: false
                        portable: false
                        semantically_introspectable: false
                        process_contained: false
                        external_io_capable: true
                      input_types:
                        event: event_envelope
                        variables: typed_variables
                      output_type: structured_actions
                  - send:
                      event: accepted
                      to:
                        external: true
                      correlation_id: "'provider-correlation'"
          type: parallel
          components:
            - component_id: replica
              with:
                external:
                  limit: '1'
              root:
                type: composite
                variables:
                  limit:
                    type: int
                    external: true
                initial:
                  transition_to: waiting
                states:
                  waiting: {}
                on_events:
                  env:
                    action:
                      - refresh: {}
            - component_id: companion
              root:
                type: composite
                initial:
                  transition_to: waiting
                states:
                  waiting: {}

format: 1
namespace: example.runtime_profile
events:
  submit:
    direction: input
    payload:
      approved:
        type: bool
        required: true
  accepted:
    direction: output
machines:
  - machine_id: order
    root:
      type: composite
      variables:
        accepted:
          type: bool
          init: false
      initial:
        transition_to: pending
      states:
        pending:
          on_events:
            submit:
              - guard: event.payload.approved == true
                action:
                  - assign:
                      accepted: 'true'
                transition_to: complete
              - guard:
                  provider:
                    provider_reference:
                      identifier: example.native-review
                      version: "1.0.0"
                      content_digest: 
                        sha256:fef0b976d1d9627a443dbd6efdbe32126099261ba45275fd2f04e9a125aeb621
                    source_media_type: 
                      application/vnd.determa.runtime-fixture+json
                    source_digest: 
                      sha256:081b362dfc2e7ea7b31d2b43236a0706811344e5aa19bf8e4de505239241636a
                    dependencies:
                      - identifier: example.native-common
                        version: "1.0.0"
                        content_digest: 
                          sha256:fef0b976d1d9627a443dbd6efdbe32126099261ba45275fd2f04e9a125aeb621
                    capabilities:
                      deterministic: false
                      pure: false
                      portable: false
                      semantically_introspectable: false
                      process_contained: false
                      external_io_capable: true
                    input_types:
                      event: event_envelope
                      variables: typed_variables
                    output_type: bool
                action:
                  - provider_actions:
                      provider_reference:
                        identifier: example.native-actions
                        version: "1.0.0"
                        content_digest: 
                          sha256:fef0b976d1d9627a443dbd6efdbe32126099261ba45275fd2f04e9a125aeb621
                      source_media_type: 
                        application/vnd.determa.runtime-fixture+json
                      source_digest: 
                        sha256:081b362dfc2e7ea7b31d2b43236a0706811344e5aa19bf8e4de505239241636a
                      dependencies:
                        - identifier: example.native-common
                          version: "1.0.0"
                          content_digest: 
                            sha256:fef0b976d1d9627a443dbd6efdbe32126099261ba45275fd2f04e9a125aeb621
                      capabilities:
                        deterministic: false
                        pure: false
                        portable: false
                        semantically_introspectable: false
                        process_contained: false
                        external_io_capable: true
                      input_types:
                        event: event_envelope
                        variables: typed_variables
                      output_type: structured_actions
                  - send:
                      event: accepted
                      to:
                        external: true
                transition_to: complete
        complete:
          type: final

format: 1
namespace: example.runtime_profile
events:
  submit:
    direction: input
    payload:
      approved:
        type: bool
        required: true
  accepted:
    direction: output
machines:
  - machine_id: order
    root:
      type: composite
      variables:
        accepted:
          type: bool
          init: false
      initial:
        transition_to: pending
      states:
        pending:
          on_events:
            submit:
              - guard: event.payload.approved == true
                action:
                  - assign:
                      accepted: 'true'
              - guard:
                  provider:
                    provider_reference:
                      identifier: example.native-review
                      version: "1.0.0"
                      content_digest:
                        sha256:78f982cf54ebec47e5ef4b49cb4cb685cfd4d291d019d1cc15b7c3333d169777
                    source_media_type:
                      application/vnd.determa.runtime-fixture+json
                    source_digest:
                      sha256:43d980fd1f87d787871c743f8989a6ec8a177f81fd89076000351fec7967b9e2
                    dependencies:
                      - identifier: example.native-common
                        version: "1.0.0"
                        content_digest:
                          sha256:78f982cf54ebec47e5ef4b49cb4cb685cfd4d291d019d1cc15b7c3333d169777
                    capabilities:
                      deterministic: false
                      pure: false
                      portable: false
                      semantically_introspectable: false
                      process_contained: false
                      external_io_capable: true
                    input_types:
                      event: event_envelope
                      variables: typed_variables
                    output_type: bool
                action:
                  - provider_actions:
                      provider_reference:
                        identifier: example.native-actions
                        version: "1.0.0"
                        content_digest:
                          sha256:78f982cf54ebec47e5ef4b49cb4cb685cfd4d291d019d1cc15b7c3333d169777
                      source_media_type:
                        application/vnd.determa.runtime-fixture+json
                      source_digest:
                        sha256:43d980fd1f87d787871c743f8989a6ec8a177f81fd89076000351fec7967b9e2
                      dependencies:
                        - identifier: example.native-common
                          version: "1.0.0"
                          content_digest:
                            sha256:78f982cf54ebec47e5ef4b49cb4cb685cfd4d291d019d1cc15b7c3333d169777
                      capabilities:
                        deterministic: false
                        pure: false
                        portable: false
                        semantically_introspectable: false
                        process_contained: false
                        external_io_capable: true
                      input_types:
                        event: event_envelope
                        variables: typed_variables
                      output_type: structured_actions
                  - send:
                      event: accepted
                      to:
                        external: true
                      correlation_id: "'provider-correlation'"

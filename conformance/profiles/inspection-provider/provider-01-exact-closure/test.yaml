title: Optional exact native provider inspection closure
static:
  documents:
    - file: machine.yaml
      valid: true
artifacts:
  documents:
    - file: provider-closure.json
      kind: json_value
      valid: true
    - file: aggregate-before.json
      kind: aggregate_state_v1
      valid: true
    - file: aggregate-after.json
      kind: aggregate_state_v1
      valid: true
    - file: requests.json
      kind: json_value
      valid: true
    - file: outcomes.json
      kind: json_value
      valid: true
inspection_vectors:
  - name: structural_safe
    covers:
      - structural_safe
    profile: core
    bundle: machine.yaml
    aggregate_before: aggregate-before.json
    aggregate_after: aggregate-after.json
    request_file: requests.json
    request_pointer: /structural_safe
    outcome_file: outcomes.json
    outcome_pointer: /structural_safe
    provider_closure_file: provider-closure.json
    provider_sources:
      - provider/test_provider.py
      - provider/test_provider.rs
    expect:
      guard_evaluations: 0
      provider_inspections: 0
      ordinary_provider_evaluations: 0
      provider_state_unchanged: true
      action_invocations: 0
      external_calls: 0
      emissions: 0

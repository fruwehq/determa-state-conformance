format: 1
namespace: conformance.persistence_atomic_v2
meta: { release: next }
events:
  host_commit: { direction: input }
  output_record:
    direction: output
    payload:
      aggregate_version: { type: int, required: true }
machines:
  - machine_id: counter
    version: 1
    root:
      type: simple
      variables:
        count: { type: int, init: 0 }
      on_events:
        host_commit:
          action:
            - send:
                event: output_record
                to: { external: true }
                payload: { aggregate_version: "1" }
                correlation_id: "event.event_id"

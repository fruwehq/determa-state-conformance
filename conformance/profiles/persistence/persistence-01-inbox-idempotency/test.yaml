title: native schema-v2 persistence inbox idempotency
static:
  documents:
    - { file: machine.yaml, valid: true }
artifacts:
  documents:
    - { file: initial-store-v2.json, kind: durable_host_store_v2, valid: true }
    - { file: committed-store-v2.json, kind: durable_host_store_v2, valid: true }
    - { file: quarantined-store-v2.json, kind: durable_host_store_v2, valid: true }
    - { file: released-store-v2.json, kind: durable_host_store_v2, valid: true }
    - { file: inputs-v2.json, kind: durable_host_inputs_v2, valid: true }
    - { file: results-v2.json, kind: durable_host_results_v2, valid: true }
    - { file: commit-call-log-v2.json, kind: durable_host_call_log_v2, valid: true }
    - { file: replay-call-log-v2.json, kind: durable_host_call_log_v2, valid: true }
    - { file: rollback-call-log-v2.json, kind: durable_host_call_log_v2, valid: true }
    - { file: quarantine-call-log-v2.json, kind: durable_host_call_log_v2, valid: true }
    - { file: release-call-log-v2.json, kind: durable_host_call_log_v2, valid: true }
durable_host_vectors:
  - name: persistence_inbox_first_commit
    covers: [persistence_inbox_first_commit]
    operation: persistence_process_v2
    store_before: initial-store-v2.json
    store_after: committed-store-v2.json
    call_log: commit-call-log-v2.json
    request: { file: inputs-v2.json, pointer: /requests/process }
    result: { file: results-v2.json, pointer: /results/committed }
    expect: { result: committed, mutation: atomic, core_calls: 1, broker_acknowledged: true }
  - name: persistence_inbox_equal_replay
    covers: [persistence_inbox_idempotency, persistence_inbox_replay_no_core_call]
    operation: persistence_process_v2
    store_before: committed-store-v2.json
    store_after: committed-store-v2.json
    call_log: replay-call-log-v2.json
    request: { file: inputs-v2.json, pointer: /requests/replay }
    result: { file: results-v2.json, pointer: /results/replayed }
    expect: { result: replayed, mutation: none, core_calls: 0, broker_acknowledged: true }

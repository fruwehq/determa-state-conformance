format: 1
namespace: conformance.case_29_owned_spawn
events:
  start: { direction: input }
  hold: { direction: input }
  invoke:
    direction: input
    payload:
      operation_token: { type: string, required: true }
  native_request:
    direction: output
    payload:
      index: { type: int, required: true }
  pay:
    direction: input
    payload:
      amount: { type: int, required: true }
machines:
  - machine_id: order
    version: 1
    root:
      type: composite
      on_events:
        invoke:
          action:
            - send:
                event: native_request
                to: { external: true }
                payload: { index: "0" }
                correlation_id: "event.payload.operation_token"
      variables:
        total: { type: int, init: 100 }
        payment_reference: { type: instance_reference, machine_id: payment, nullable: true, init: null }
      initial: { transition_to: idle }
      states:
        idle:
          on_events:
            start:
              transition_to: checkout
              action:
                - spawn:
                    machine_id: payment
                    bindings: { input: { due: "total" } }
                    bind_to: payment_reference
        checkout:
          on_events:
            done: { transition_to: paid }
        paid: {}
  - machine_id: payment
    version: 1
    root:
      type: composite
      deferred_event_capacity: 16
      variables:
        due: { type: int, input: true }
        paid: { type: int, init: 0 }
      initial: { transition_to: awaiting }
      states:
        awaiting:
          deferred_events: [hold]
          on_events:
            pay:
              guard: "event.payload.amount >= due"
              transition_to: settled
              action:
                - assign: { paid: "event.payload.amount" }
        settled: { type: final }

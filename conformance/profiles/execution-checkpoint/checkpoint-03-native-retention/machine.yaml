format: 1
namespace: conformance.execution_checkpoint_native_retention
events:
  increment:
    direction: input
    payload:
      amount: { type: int, required: true }
  complete: { direction: input }
machines:
  - machine_id: counter
    version: 1
    root:
      type: composite
      variables:
        count: { type: int, init: 0 }
      initial: { transition_to: active }
      on_events:
        increment:
          action:
            - assign: { count: "count + event.payload.amount" }
        complete: { transition_to: finished }
      states:
        active: {}
        finished: { type: final }

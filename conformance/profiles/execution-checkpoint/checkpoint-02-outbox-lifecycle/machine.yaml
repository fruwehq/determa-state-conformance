format: 1
namespace: conformance.execution_checkpoint_outbox
events:
  emit_outputs:
    direction: input
    payload:
      batch_id: { type: string, required: true }
  output_record:
    direction: output
    payload:
      index: { type: int, required: true }
machines:
  - machine_id: emitter
    version: 1
    root:
      type: simple
      variables:
        emitted: { type: int, init: 0 }
      on_events:
        emit_outputs:
          action:
            - assign: { emitted: "emitted + 8" }
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "0" }
                correlation_id: "event.payload.batch_id + '-0'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "1" }
                correlation_id: "event.payload.batch_id + '-1'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "2" }
                correlation_id: "event.payload.batch_id + '-2'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "3" }
                correlation_id: "event.payload.batch_id + '-3'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "4" }
                correlation_id: "event.payload.batch_id + '-4'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "5" }
                correlation_id: "event.payload.batch_id + '-5'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "6" }
                correlation_id: "event.payload.batch_id + '-6'"
            - send:
                event: output_record
                to: { external: true }
                payload: { index: "7" }
                correlation_id: "event.payload.batch_id + '-7'"

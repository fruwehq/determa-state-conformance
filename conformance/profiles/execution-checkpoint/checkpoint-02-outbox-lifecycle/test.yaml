title: execution checkpoint outbox lifecycle
static:
  documents:
    - file: machine.yaml
      valid: true
artifacts:
  documents:
    - { file: inputs.json, kind: execution_checkpoint_inputs, valid: true }
    - { file: core-results.json, kind: execution_checkpoint_core_evidence, valid: true }
    - { file: outbox-base-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-created-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-retryable-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-ambiguous-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-confirmed-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-permanently_rejected-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-operator_cancelled-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-discarded-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-dead_lettered-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: outbox-total-checkpoint.json, kind: execution_checkpoint, valid: true }
    - file: outbox-total-checkpoint.canonical.json
      kind: execution_checkpoint
      valid: true
      canonical_of: outbox-total-checkpoint.json
    - { file: outbox-compact-checkpoint.json, kind: execution_checkpoint, valid: true }
    - file: invalid-dangling-outbox-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: invalid-outbox-order-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: invalid-compact-intent-digest-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
      semantic_probe: compact_intent_digest
      semantic_source: outbox-total-checkpoint.json
      semantic_expected: outbox-compact-checkpoint.json
      semantic_input_file: inputs.json
      semantic_input_pointer: /requests/compact_confirmed
    - file: invalid-pending-outbox-revision-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
execution_checkpoint_profile:
  vectors:
    - name: foreground_output_creates_exact_intents
      covers: [outbox_not_attempted, outbox_receipt_linkage]
      operation: foreground_process_delivery
      checkpoint_before: outbox-base-checkpoint.json
      input: { file: inputs.json, pointer: /requests/emit_outputs }
      core_result: { file: core-results.json, pointer: /calls/emit_outputs }
      expect:
        result: committed
        checkpoint_after: outbox-created-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "1"
    - name: retryable_failure_commits_once
      covers: [outbox_retryable_failure]
      operation: update_pending_outbox
      checkpoint_before: outbox-created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/retryable }
      expect:
        result: committed
        checkpoint_after: outbox-retryable-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: equal_pending_update_repeats_actual_operation
      covers: [outbox_idempotent_pending_update]
      operation: update_pending_outbox
      checkpoint_before: outbox-retryable-checkpoint.json
      input: { file: inputs.json, pointer: /requests/retryable }
      expect:
        result: committed
        checkpoint_after: outbox-retryable-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: stale_outbox_writer_conflicts_on_real_update
      covers: [stale_outbox_cas_conflict]
      operation: update_pending_outbox
      checkpoint_before: outbox-created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/stale_outbox_update }
      expect:
        result: failure
        code: checkpoint_revision_conflict
        checkpoint_after: outbox-created-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: ambiguous_failure_remains_pending
      covers: [outbox_ambiguous]
      operation: update_pending_outbox
      checkpoint_before: outbox-retryable-checkpoint.json
      input: { file: inputs.json, pointer: /requests/ambiguous }
      expect:
        result: committed
        checkpoint_after: outbox-ambiguous-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: confirmed_outcome_terminalizes
      covers: [outbox_confirmed]
      operation: terminalize_outbox
      checkpoint_before: outbox-ambiguous-checkpoint.json
      input: { file: inputs.json, pointer: /requests/confirmed }
      expect:
        result: committed
        checkpoint_after: outbox-confirmed-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: permanent_rejection_is_terminal
      covers: [outbox_permanently_rejected]
      operation: terminalize_outbox
      checkpoint_before: outbox-confirmed-checkpoint.json
      input: { file: inputs.json, pointer: /requests/permanently_rejected }
      expect:
        result: committed
        checkpoint_after: outbox-permanently_rejected-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: operator_cancellation_is_terminal
      covers: [outbox_operator_cancelled]
      operation: terminalize_outbox
      checkpoint_before: outbox-permanently_rejected-checkpoint.json
      input: { file: inputs.json, pointer: /requests/operator_cancelled }
      expect:
        result: committed
        checkpoint_after: outbox-operator_cancelled-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: declared_discard_is_terminal
      covers: [outbox_discarded]
      operation: terminalize_outbox
      checkpoint_before: outbox-operator_cancelled-checkpoint.json
      input: { file: inputs.json, pointer: /requests/discarded }
      expect:
        result: committed
        checkpoint_after: outbox-discarded-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: dead_letter_is_terminal
      covers: [outbox_dead_lettered]
      operation: terminalize_outbox
      checkpoint_before: outbox-discarded-checkpoint.json
      input: { file: inputs.json, pointer: /requests/dead_lettered }
      expect:
        result: committed
        checkpoint_after: outbox-dead_lettered-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: equal_terminal_update_repeats_actual_operation
      covers: [outbox_idempotent_terminal_update]
      operation: terminalize_outbox
      checkpoint_before: outbox-total-checkpoint.json
      input: { file: inputs.json, pointer: /requests/dead_lettered }
      expect:
        result: committed
        checkpoint_after: outbox-total-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: unequal_terminal_update_conflicts
      covers: [outbox_effect_conflict]
      operation: terminalize_outbox
      checkpoint_before: outbox-total-checkpoint.json
      input: { file: inputs.json, pointer: /requests/terminal_conflict }
      expect:
        result: failure
        code: effect_id_conflict
        checkpoint_after: outbox-total-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: terminal_intent_compacts_to_tombstone
      covers: [outbox_compact_tombstone]
      operation: compact_outbox
      checkpoint_before: outbox-total-checkpoint.json
      input: { file: inputs.json, pointer: /requests/compact_confirmed }
      expect:
        result: committed
        checkpoint_after: outbox-compact-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: referenced_effect_cannot_be_deleted
      covers: [outbox_forbidden_deletion]
      operation: delete_outbox_record
      checkpoint_before: outbox-compact-checkpoint.json
      input: { file: inputs.json, pointer: /requests/delete_referenced }
      expect:
        result: failure
        code: invalid_execution_checkpoint
        checkpoint_after: outbox-compact-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none

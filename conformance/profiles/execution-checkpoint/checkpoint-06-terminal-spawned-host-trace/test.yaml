title: native schema-v1 terminal spawned child and root host trace
static:
  documents:
    - { file: machine.yaml, valid: true }
artifacts:
  documents:
    - { file: spawned-base-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-start-pending-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-started-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-child-pending-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-root-pending-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-child-terminal-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-owner-event-terminal-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: spawned-terminal-checkpoint-v1.json, kind: execution_checkpoint_v1, valid: true }
    - { file: inputs-v1.json, kind: durable_host_inputs_v1, valid: true }
    - { file: results-v1.json, kind: durable_host_results_v1, valid: true }
    - { file: responses-v1.json, kind: durable_host_responses_v1, valid: true }
durable_host_vectors:
  - name: terminal_spawned_creation
    covers: [terminal_spawned_creation]
    operation: checkpoint_create_v1
    checkpoint_before: null
    checkpoint_after: spawned-base-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/create }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/create }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_start_admission
    covers: [terminal_spawned_start_admission]
    operation: checkpoint_admit_v1
    checkpoint_before: spawned-base-checkpoint-v1.json
    checkpoint_after: spawned-start-pending-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/start_accept }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/start_accept }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_start
    covers: [terminal_spawned_start]
    operation: checkpoint_step_v1
    checkpoint_before: spawned-start-pending-checkpoint-v1.json
    checkpoint_after: spawned-started-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/start_process }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/start_process }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_child_admission
    covers: [terminal_spawned_child_admission]
    operation: checkpoint_admit_v1
    checkpoint_before: spawned-started-checkpoint-v1.json
    checkpoint_after: spawned-child-pending-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/child_accept }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/child_accept }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_root_admission
    covers: [terminal_spawned_root_admission]
    operation: checkpoint_admit_v1
    checkpoint_before: spawned-child-pending-checkpoint-v1.json
    checkpoint_after: spawned-root-pending-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/root_accept }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/root_accept }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_child_processing
    covers: [terminal_spawned_child_processing]
    operation: checkpoint_step_v1
    checkpoint_before: spawned-root-pending-checkpoint-v1.json
    checkpoint_after: spawned-child-terminal-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/child_process }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/child_process }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_root_processing
    covers: [terminal_spawned_root_processing, terminal_spawned_unhandled_allocates_no_logical_step]
    operation: checkpoint_step_v1
    checkpoint_before: spawned-child-terminal-checkpoint-v1.json
    checkpoint_after: spawned-owner-event-terminal-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/root_process }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/root_process }
    expect: { result: committed, mutation: atomic, core_calls: 1 }
  - name: terminal_spawned_done_processing
    covers: [terminal_spawned_done_processing, terminal_spawned_completion_reports_aggregate_status]
    operation: checkpoint_step_v1
    checkpoint_before: spawned-owner-event-terminal-checkpoint-v1.json
    checkpoint_after: spawned-terminal-checkpoint-v1.json
    request: { file: inputs-v1.json, pointer: /requests/done_process }
    result: { file: results-v1.json, pointer: /results/committed }
    raw_response: { file: responses-v1.json, pointer: /responses/done_process }
    expect: { result: committed, mutation: atomic, core_calls: 1 }

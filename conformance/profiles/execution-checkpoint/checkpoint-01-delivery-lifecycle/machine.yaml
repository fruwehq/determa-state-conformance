format: 1
namespace: conformance.execution_checkpoint_delivery
events:
  increment:
    direction: input
    payload:
      amount: { type: int, required: true }
  emit_internal:
    direction: input
    payload:
      amount: { type: int, required: true }
  internal_increment:
    direction: internal
    payload:
      amount: { type: int, required: true }
  unhandled: { direction: input }
  deliberate_fault: { direction: input }
machines:
  - machine_id: counter
    version: 1
    root:
      type: simple
      variables:
        count: { type: int, init: 0 }
      on_events:
        increment:
          action:
            - assign: { count: "count + event.payload.amount" }
        emit_internal:
          action:
            - send:
                event: internal_increment
                payload: { amount: "event.payload.amount" }
        internal_increment:
          action:
            - assign: { count: "count + event.payload.amount" }
        deliberate_fault:
          action:
            - assign: { count: "count / 0" }

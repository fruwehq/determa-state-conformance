title: execution checkpoint delivery lifecycle
static:
  documents:
    - file: machine.yaml
      valid: true
artifacts:
  documents:
    - { file: inputs.json, kind: execution_checkpoint_inputs, valid: true }
    - { file: core-results.json, kind: execution_checkpoint_core_evidence, valid: true }
    - { file: created-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: accepted-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: processed-checkpoint.json, kind: execution_checkpoint, valid: true }
    - file: processed-checkpoint.canonical.json
      kind: execution_checkpoint
      valid: true
      canonical_of: processed-checkpoint.json
    - { file: internal-pending-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: internal-processed-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: unhandled-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: rejected-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: faulted-checkpoint.json, kind: execution_checkpoint, valid: true }
    - file: invalid-foreign-target-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: invalid-permanent-delivery-gap-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
execution_checkpoint_profile:
  vectors:
    - name: create_commits_exact_core_result
      covers: [creation_commit]
      operation: create
      checkpoint_before: null
      input: { file: inputs.json, pointer: /requests/create }
      core_result: { file: core-results.json, pointer: /calls/create }
      expect:
        result: committed
        checkpoint_after: created-checkpoint.json
        checkpoint_mutation: created
        core_call: create
        receipt_sequence: "0"
    - name: equal_creation_repeats_create_operation
      covers: [creation_replay]
      operation: create
      checkpoint_before: created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/create }
      expect:
        result: committed
        checkpoint_after: created-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
        receipt_sequence: "0"
    - name: unequal_creation_conflicts
      covers: [creation_conflict]
      operation: create
      checkpoint_before: created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/create_conflict }
      expect:
        result: failure
        code: creation_id_conflict
        checkpoint_after: created-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: rejected_creation_reserves_nothing
      covers: [creation_rejection_without_checkpoint]
      operation: create
      checkpoint_before: null
      input: { file: inputs.json, pointer: /requests/create_rejected }
      core_result: { file: core-results.json, pointer: /calls/create_rejected }
      expect:
        result: failure
        code: creation_rejected
        checkpoint_after: null
        checkpoint_mutation: absent
        core_call: create
    - name: delayed_input_is_durably_accepted
      covers: [durable_pending_acceptance]
      operation: accept_delivery
      checkpoint_before: created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/accept_increment }
      expect:
        result: pending
        checkpoint_after: accepted-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
        delivery_sequence: "0"
        accepted_revision: "1"
    - name: equal_pending_acceptance_repeats_accept
      covers: [pending_acceptance_replay]
      operation: accept_delivery
      checkpoint_before: accepted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/accept_increment }
      expect:
        result: pending
        checkpoint_after: accepted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
        delivery_sequence: "0"
        accepted_revision: "1"
    - name: crash_before_processing_commit_rolls_back
      covers: [pre_commit_rollback]
      operation: process_pending_delivery
      checkpoint_before: accepted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/process_increment }
      core_result: { file: core-results.json, pointer: /calls/increment }
      failure_boundary: before_commit
      expect:
        result: failure
        code: injected_pre_commit_failure
        checkpoint_after: accepted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: dispatch
    - name: delayed_input_commits_handled_result
      covers: [delayed_processing, revision_progression]
      operation: process_pending_delivery
      checkpoint_before: accepted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/process_increment }
      core_result: { file: core-results.json, pointer: /calls/increment }
      expect:
        result: committed
        checkpoint_after: processed-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "1"
    - name: delivery_commit_survives_response_loss
      covers: [post_commit_response_loss_replay]
      operation: process_pending_delivery
      checkpoint_before: accepted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/process_increment }
      core_result: { file: core-results.json, pointer: /calls/increment }
      failure_boundary: after_commit_before_response
      expect:
        result: response_lost
        code: response_lost_after_commit
        checkpoint_after: processed-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "1"
    - name: committed_delivery_repeats_accept_operation
      covers: [committed_receipt_replay]
      operation: accept_delivery
      checkpoint_before: processed-checkpoint.json
      input: { file: inputs.json, pointer: /requests/accept_increment }
      expect:
        result: committed
        checkpoint_after: processed-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
        receipt_sequence: "1"
    - name: foreground_send_commits_internal_pending
      covers: [foreground_processing, internal_pending_delivery]
      operation: foreground_process_delivery
      checkpoint_before: processed-checkpoint.json
      input: { file: inputs.json, pointer: /requests/emit_internal }
      core_result: { file: core-results.json, pointer: /calls/emit_internal }
      expect:
        result: committed
        checkpoint_after: internal-pending-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "2"
    - name: delayed_internal_delivery_is_processed
      covers: [internal_delivery_processing]
      operation: process_pending_delivery
      checkpoint_before: internal-pending-checkpoint.json
      input: { file: inputs.json, pointer: /requests/internal_increment }
      core_result: { file: core-results.json, pointer: /calls/internal_increment }
      expect:
        result: committed
        checkpoint_after: internal-processed-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "3"
    - name: declared_but_unhandled_delivery_is_total
      covers: [unhandled_delivery]
      operation: foreground_process_delivery
      checkpoint_before: internal-processed-checkpoint.json
      input: { file: inputs.json, pointer: /requests/unhandled }
      core_result: { file: core-results.json, pointer: /calls/unhandled }
      expect:
        result: committed
        checkpoint_after: unhandled-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "4"
    - name: foreground_rejection_is_total
      covers: [rejected_delivery]
      operation: foreground_process_delivery
      checkpoint_before: unhandled-checkpoint.json
      input: { file: inputs.json, pointer: /requests/rejected }
      core_result: { file: core-results.json, pointer: /calls/rejected }
      expect:
        result: committed
        checkpoint_after: rejected-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "5"
    - name: deliberate_fault_rolls_back_and_is_total
      covers: [faulted_delivery]
      operation: foreground_process_delivery
      checkpoint_before: rejected-checkpoint.json
      input: { file: inputs.json, pointer: /requests/fault }
      core_result: { file: core-results.json, pointer: /calls/fault }
      expect:
        result: committed
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: changed
        core_call: dispatch
        receipt_sequence: "6"
    - name: stale_pending_processor_conflicts_before_dispatch
      covers: [stale_processing_cas_conflict]
      operation: process_pending_delivery
      checkpoint_before: accepted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/process_increment_stale }
      expect:
        result: failure
        code: checkpoint_revision_conflict
        checkpoint_after: accepted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: malformed_delivery_is_not_accepted
      covers: [pre_acceptance_malformed_delivery]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/malformed }
      expect:
        result: not_accepted
        code: malformed_delivery
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: wrong_root_is_not_accepted
      covers: [pre_acceptance_wrong_root]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/wrong_root }
      expect:
        result: not_accepted
        code: wrong_root
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: retained_event_conflict_precedes_invalid_mode
      covers: [replay_event_id_conflict_precedes_invalid_delivery_mode]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/invalid_mode }
      expect:
        result: not_accepted
        code: event_id_conflict
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: retained_receipt_replay_precedes_invalid_origin
      covers: [replay_committed_receipt_precedes_invalid_delivery_origin]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/invalid_origin }
      expect:
        result: committed
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
        receipt_sequence: "1"
    - name: fresh_invalid_mode_is_not_accepted
      covers: [pre_acceptance_invalid_delivery_mode]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/fresh_invalid_mode }
      expect:
        result: not_accepted
        code: invalid_delivery_mode
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: fresh_invalid_origin_is_not_accepted
      covers: [pre_acceptance_invalid_delivery_origin]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/fresh_invalid_origin }
      expect:
        result: not_accepted
        code: invalid_delivery_origin
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: supplied_digest_mismatch_is_not_accepted
      covers: [pre_acceptance_delivery_digest_mismatch]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/digest_mismatch }
      expect:
        result: not_accepted
        code: delivery_digest_mismatch
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: retained_event_identity_conflicts
      covers: [pre_acceptance_event_id_conflict]
      operation: accept_delivery
      checkpoint_before: faulted-checkpoint.json
      input: { file: inputs.json, pointer: /requests/event_conflict }
      expect:
        result: not_accepted
        code: event_id_conflict
        checkpoint_after: faulted-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none

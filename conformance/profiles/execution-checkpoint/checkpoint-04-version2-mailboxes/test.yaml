title: execution checkpoint version 2 acceptance processing replay and retention
static:
  documents:
    - { file: machine.yaml, valid: true }
    - { file: deferral-machine.yaml, valid: true }
artifacts:
  documents:
    - { file: base-checkpoint.json, kind: execution_checkpoint_v2, valid: true }
    - { file: base-checkpoint-v1.json, kind: execution_checkpoint, valid: true }
    - { file: upgraded-checkpoint-v2.json, kind: execution_checkpoint_v2, valid: true }
    - { file: admitted-checkpoint-v2.json, kind: execution_checkpoint_v2, valid: true }
    - { file: terminal-checkpoint-v2.json, kind: execution_checkpoint_v2, valid: true }
    - { file: compact-checkpoint-v2.json, kind: execution_checkpoint_v2, valid: true }
    - { file: invalid-duplicate-location-checkpoint-v2.json, kind: execution_checkpoint_v2, valid: false, error: invalid_execution_checkpoint }
    - { file: checkpoint-requests.json, kind: json_value, valid: true }
    - { file: terminal-replay-result.json, kind: version2_operation_result, valid: true }
    - { file: tombstone-replay-result.json, kind: version2_operation_result, valid: true }
version2_vectors:
  - name: explicit_checkpoint_upgrade
    covers:
      - checkpoint_v2_schema_positive_negative
      - upgrade_checkpoint_v1_to_v2_legacy_evidence
    operation: upgrade_checkpoint_v1_to_v2
    checkpoint_before: base-checkpoint-v1.json
    expect: { result: success, exact_result_file: upgraded-checkpoint-v2.json }
  - name: checkpoint_atomic_admission
    covers: [receipt_acceptance_terminal_distinction]
    operation: checkpoint_admit_v2
    checkpoint_before: upgraded-checkpoint-v2.json
    request_file: checkpoint-requests.json
    request_pointer: /admit
    expect: { result: success, exact_result_file: admitted-checkpoint-v2.json }
  - name: version1_host_rejects_deferral_bundle
    covers: [checkpoint_v1_requires_upgrade]
    operation: checkpoint_v1_accept
    bundle: deferral-machine.yaml
    checkpoint_before: base-checkpoint-v1.json
    request_file: checkpoint-requests.json
    request_pointer: /admit
    expect:
      result: failure
      code: checkpoint_upgrade_required
      unchanged_file: base-checkpoint-v1.json
      caller_still_owns_input: true
  - name: checkpoint_terminal_processing
    covers: [terminal_processing_receipt]
    operation: checkpoint_step_v2
    checkpoint_before: admitted-checkpoint-v2.json
    target_runtime_id: sha256:1f8282e6ea121e7e2d8b139c0dfb30c8ed0f1a0cad1d0590321587b76736e885
    expect: { result: success, exact_result_file: terminal-checkpoint-v2.json }
  - name: checkpoint_terminal_replay
    covers: [equal_terminal_replay, terminal_receipt_replay]
    operation: checkpoint_admit_v2
    checkpoint_before: terminal-checkpoint-v2.json
    request_file: checkpoint-requests.json
    request_pointer: /terminal_equal_replay
    expect: { result: success, exact_result_file: terminal-replay-result.json }
  - name: checkpoint_terminal_conflict
    covers: [conflicting_terminal_replay]
    operation: checkpoint_admit_v2
    checkpoint_before: terminal-checkpoint-v2.json
    request_file: checkpoint-requests.json
    request_pointer: /terminal_conflict
    expect:
      result: failure
      code: event_id_conflict
      unchanged_file: terminal-checkpoint-v2.json
      caller_still_owns_input: true
  - name: checkpoint_dependency_closed_compaction
    covers: [version2_dependency_safe_pruning]
    operation: checkpoint_prune_v2
    checkpoint_before: terminal-checkpoint-v2.json
    expect: { result: success, exact_result_file: compact-checkpoint-v2.json }
  - name: checkpoint_tombstone_replay
    covers: [terminal_tombstone_replay]
    operation: checkpoint_admit_v2
    checkpoint_before: compact-checkpoint-v2.json
    request_file: checkpoint-requests.json
    request_pointer: /terminal_equal_replay
    expect: { result: success, exact_result_file: tombstone-replay-result.json }

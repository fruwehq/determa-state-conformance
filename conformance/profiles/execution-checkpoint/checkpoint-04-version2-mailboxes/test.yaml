version2_vectors:
  - name: explicit_checkpoint_upgrade
    covers:
      - checkpoint_v2_schema_positive_negative
      - upgrade_checkpoint_v1_to_v2_legacy_evidence
    operation: upgrade_checkpoint_v1_to_v2
    checkpoint_before: base-checkpoint-v1.json
    request_file: operation-inputs.json
    request_pointer: /upgrade
    expect: { result: success, exact_result_file: upgraded-checkpoint-v2.json }
  - name: checkpoint_upgrade_preserves_spawned_child_target
    covers: [upgrade_checkpoint_v1_spawned_target]
    operation: upgrade_checkpoint_v1_to_v2
    bundle: spawn-machine.yaml
    checkpoint_before: spawned-child-checkpoint-v1.json
    request_file: operation-inputs.json
    request_pointer: /upgrade_spawned_child
    expect: { result: success, exact_result_file: spawned-child-checkpoint-v2.json }
  - name: checkpoint_upgrade_preserves_multi_pending_acceptance_history
    covers: [upgrade_checkpoint_v1_multi_pending_history]
    operation: upgrade_checkpoint_v1_to_v2
    checkpoint_before: multi-pending-checkpoint-v1.json
    request_file: operation-inputs.json
    request_pointer: /upgrade_multi_pending
    expect: { result: success, exact_result_file: multi-pending-upgraded-checkpoint-v2.json }
  - name: processed_upgraded_host_acceptance_without_optional_metadata
    covers: [processed_upgrade_history_without_optional_metadata]
    operation: checkpoint_step_v2
    checkpoint_before: multi-pending-upgraded-checkpoint-v2.json
    request_file: operation-inputs.json
    request_pointer: /process_upgraded_without_metadata
    expect: { result: success, exact_result_file: multi-pending-processed-checkpoint-v2.json }
  - name: processed_upgraded_host_acceptance_with_optional_metadata

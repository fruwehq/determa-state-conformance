format: 1
namespace: conformance.execution_checkpoint_complete_host_contract
events:
  increment:
    direction: input
    payload:
      amount: { type: int, required: true }
  ignored:
    direction: input
  reject:
    direction: input
  fail:
    direction: input
  work_requested:
    direction: output
  work_completed:
    direction: input
    correlates_to: work_requested
machines:
  - machine_id: counter
    version: 1
    root:
      type: simple
      variables:
        count: { type: int, init: 0 }
      on_events:
        increment:
          action:
            - assign: { count: "count + event.payload.amount" }
        fail:
          action:
            - assign: { count: "count / 0" }

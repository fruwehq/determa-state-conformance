format: 1
namespace: conformance.execution_checkpoint_migration
meta: { release: next }
events:
  increment: { direction: input }
machines:
  - machine_id: workflow
    version: 1
    root:
      type: composite
      history: deep
      variables:
        new_count: { type: int, init: 0 }
        added: { type: bool, init: false }
      initial: { transition_to: new_state }
      states:
        new_state:
          variables:
            renamed_shadow: { type: int, init: 0 }

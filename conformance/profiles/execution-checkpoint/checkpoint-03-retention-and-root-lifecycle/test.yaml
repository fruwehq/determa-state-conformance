title: execution checkpoint retention root adapter and host profiles
static:
  documents:
    - { file: machine.yaml, valid: true }
    - { file: terminal.yaml, valid: true }
    - { file: migration-source.yaml, valid: true }
    - { file: migration-target.yaml, valid: true }
artifacts:
  documents:
    - { file: inputs.json, kind: execution_checkpoint_inputs, valid: true }
    - { file: core-results.json, kind: execution_checkpoint_core_evidence, valid: true }
    - { file: migration-descriptor.json, kind: migration_descriptor, valid: true }
    - { file: migration-descriptor-conflict.json, kind: migration_descriptor, valid: true }
    - { file: maintenance-created-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: maintenance-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: dependency-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: bounded-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: completed-checkpoint.json, kind: execution_checkpoint, valid: true }
    - { file: tombstone-checkpoint.json, kind: execution_checkpoint, valid: true }
    - file: tombstone-checkpoint.canonical.json
      kind: execution_checkpoint
      valid: true
      canonical_of: tombstone-checkpoint.json
    - file: invalid-bounded-dependency-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: invalid-unrelated-tombstone-digest-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: unsupported-format-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: unsupported_execution_checkpoint_format
    - file: legacy-0.0.6-snapshot.json
      kind: execution_checkpoint
      valid: false
      error: unsupported_execution_checkpoint_format
    - file: unsupported-version-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: unsupported_execution_checkpoint_schema_version
    - file: invalid-schema-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: invalid_execution_checkpoint
    - file: digest-mismatch-checkpoint.json
      kind: execution_checkpoint
      valid: false
      error: execution_checkpoint_digest_mismatch
execution_checkpoint_profile:
  vectors:
    - name: maintenance_migration_commits_non_empty_audit
      covers: [maintenance_migration_commit, migration_audit_non_empty]
      operation: maintenance_migration
      checkpoint_before: maintenance-created-checkpoint.json
      input: { file: inputs.json, pointer: /requests/maintenance }
      core_result: { file: core-results.json, pointer: /calls/maintenance_migration }
      failure_boundary: after_commit_before_response
      expect:
        result: response_lost
        code: response_lost_after_commit
        checkpoint_after: maintenance-checkpoint.json
        checkpoint_mutation: changed
        core_call: migrate
        receipt_sequence: "1"
    - name: maintenance_replay_repeats_same_operation
      covers: [maintenance_migration_replay, permanent_receipt_retention]
      operation: maintenance_migration
      checkpoint_before: maintenance-checkpoint.json
      input: { file: inputs.json, pointer: /requests/maintenance }
      expect:
        result: committed
        checkpoint_after: maintenance-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
        receipt_sequence: "1"
    - name: unequal_maintenance_request_conflicts
      covers: [maintenance_migration_conflict]
      operation: maintenance_migration
      checkpoint_before: maintenance-checkpoint.json
      input: { file: inputs.json, pointer: /requests/maintenance_conflict }
      expect:
        result: failure
        code: operation_id_conflict
        checkpoint_after: maintenance-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: bounded_pruning_commits_dependency_safe_interval
      covers: [bounded_receipt_retention, permanent_to_bounded_irreversible]
      operation: update_replay_retention
      checkpoint_before: dependency-checkpoint.json
      input: { file: inputs.json, pointer: /requests/prune_through_1 }
      expect:
        result: committed
        checkpoint_after: bounded-checkpoint.json
        checkpoint_mutation: changed
        core_call: none
    - name: pruning_cannot_cross_retained_internal_origin
      covers: [dependency_safe_pruning]
      operation: update_replay_retention
      checkpoint_before: dependency-checkpoint.json
      input: { file: inputs.json, pointer: /requests/prune_through_2_dependency_conflict }
      expect:
        result: failure
        code: invalid_execution_checkpoint
        checkpoint_after: dependency-checkpoint.json
        checkpoint_mutation: unchanged
        core_call: none
    - name: stale_pruning_writer_conflicts
      covers: [stale_pruning_cas_conflict]

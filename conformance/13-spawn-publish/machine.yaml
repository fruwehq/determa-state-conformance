format: 1
namespace: conformance.case_13_spawn_publish
events:
  start:
    direction: input
  child_done: {direction: input, payload: {id: {type: string}}, scope: local}
  go:
    direction: input
machines:
  - machine_id: parent
    version: 1
    root:
      type: composite
      variables:
        last: {type: string, init: null}
        finished: {type: int, init: 0}
      on_events:
        child_done:
          action: [assign: {finished: "finished + 1"}]
      initial: {transition_to: idle}
      states:
        idle:
          on_events:
            start:
              action: [spawn: {def: child, result: last}]       # internal

  - machine_id: child
    version: 1
    root:
      type: composite
      initial: {transition_to: run}
      states:
        run:
          on_events:
            go: {transition_to: fin}
        fin:
          type: final
          entry:
            - publish: {event: child_done, to: parent, payload: {id: "id"}}

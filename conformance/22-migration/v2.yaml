format: 1
namespace: conformance.case_22_migration
events:
  down:
    direction: input
  up:
    direction: input
machines:
  - machine_id: m
    version: 2
    migrations:
      - from: 1
        to: 2
        when: "state in ['online','offline']"
        state_map: {online: connected, offline: disconnected}
        variables: [assign: {n: "n + 1000"}]
    root:
      type: composite
      variables:
        n: {type: int, init: 0}
      initial: {transition_to: connected}
      states:
        connected:
          on_events:
            down: {transition_to: disconnected}
        disconnected:
          on_events:
            up: {transition_to: connected}

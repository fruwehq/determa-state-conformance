format: 1
namespace: conformance.case_22_migration
events:
  down:
    direction: input
  up:
    direction: input
machines:
  - machine_id: m
    version: 1
    root:
      type: composite
      variables:
        n: {type: int, init: 0}
      initial: {transition_to: online}
      states:
        online:
          on_events:
            down: {transition_to: offline}
        offline:
          on_events:
            up: {transition_to: online}

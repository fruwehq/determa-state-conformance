format: 1
namespace: conformance.case_29_owned_spawn
events:
  start:
    direction: input
  pay:
    direction: input
    payload:
      amount: { type: int, required: true }
machines:
  - machine_id: order
    version: 1
    root:
      type: composite
      variables:
        total: { type: int, init: 100 }
        # Root scope deliberately lets the child outlive ordinary transitions.
        payment_reference:
          type: instance_reference
          machine_id: payment
          nullable: true
          init: null
      initial: { transition_to: idle }
      states:
        idle:
          on_events:
            start:
              transition_to: checkout
              action:
                - spawn:
                    machine_id: payment
                    bindings:
                      input:
                        due: "total"
                    bind_to: payment_reference
        checkout:
          on_events:
            done: { transition_to: paid }
        paid: {}
  - machine_id: payment
    version: 9007199254740992
    root:
      type: composite
      variables:
        due: { type: int, input: true }
        paid: { type: int, init: 0 }
      initial: { transition_to: awaiting }
      states:
        awaiting:
          on_events:
            pay:
              guard: "event.payload.amount >= due"
              transition_to: settled
              action:
                - assign: { paid: "event.payload.amount" }
        settled: { type: final }

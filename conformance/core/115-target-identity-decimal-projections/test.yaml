title: target identity decimal projections preserve unsafe integers and reject numeric
  wire forms
static:
  documents:
    - file: component-machine.yaml
      valid: true
    - file: spawn-version-javascript-safe-maximum.yaml
      valid: true
    - file: spawn-version-first-javascript-unsafe.yaml
      valid: true
    - file: spawn-version-javascript-rounding-gap.yaml
      valid: true
    - file: spawn-version-signed64-maximum.yaml
      valid: true
artifacts:
  documents:
    - file: spawned-javascript-safe-maximum.json
      kind: aggregate_state
      valid: true
    - file: spawned-javascript-safe-maximum.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: spawned-javascript-safe-maximum.json
    - file: spawned-first-javascript-unsafe.json
      kind: aggregate_state
      valid: true
    - file: spawned-first-javascript-unsafe.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: spawned-first-javascript-unsafe.json
    - file: spawned-javascript-rounding-gap.json
      kind: aggregate_state
      valid: true
    - file: spawned-javascript-rounding-gap.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: spawned-javascript-rounding-gap.json
    - file: spawned-signed64-maximum.json
      kind: aggregate_state
      valid: true
    - file: spawned-signed64-maximum.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: spawned-signed64-maximum.json
    - file: spawned-numeric-machine-version.json
      kind: aggregate_state
      valid: false
      error: invalid_aggregate_state
    - file: spawned-machine-version-above-signed64.json
      kind: aggregate_state
      valid: true
    - file: component-javascript-safe-maximum.json
      kind: aggregate_state
      valid: true
    - file: component-javascript-safe-maximum.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: component-javascript-safe-maximum.json
    - file: component-first-javascript-unsafe.json
      kind: aggregate_state
      valid: true
    - file: component-first-javascript-unsafe.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: component-first-javascript-unsafe.json
    - file: component-unbounded.json
      kind: aggregate_state
      valid: true
    - file: component-unbounded.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: component-unbounded.json
    - file: component-numeric-activation.json
      kind: aggregate_state
      valid: false
      error: invalid_aggregate_state
persistence_vectors:
  - name: spawned_machine_version_javascript_safe_maximum
    operation: restore_and_serialize
    aggregate_state: spawned-javascript-safe-maximum.json
    definitions:
      - spawn-version-javascript-safe-maximum.yaml
    expect:
      result: success
      aggregate_state_file: spawned-javascript-safe-maximum.json
      exact_bytes_file: spawned-javascript-safe-maximum.canonical.json
  - name: spawned_machine_version_first_javascript_unsafe
    operation: restore_and_serialize
    aggregate_state: spawned-first-javascript-unsafe.json
    definitions:
      - spawn-version-first-javascript-unsafe.yaml

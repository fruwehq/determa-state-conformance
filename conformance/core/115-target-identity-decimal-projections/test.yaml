      exact_bytes_file: spawned-signed64-maximum.canonical.json
  - name: spawned_numeric_machine_version_rejected
    operation: restore_and_serialize
    aggregate_state: spawned-numeric-machine-version.json
    definitions:
      - spawn-version-javascript-safe-maximum.yaml
    expect:
      result: failure
      code: invalid_aggregate_state
      caller_still_owns_aggregate: true
  - name: spawned_machine_version_above_signed64_rejected
    operation: restore_and_serialize
    aggregate_state: spawned-machine-version-above-signed64.json
    definitions:
      - spawn-version-signed64-maximum.yaml
    expect:
      result: failure
      code: invalid_aggregate_state
      caller_still_owns_aggregate: true

title: closed migration request, resolution, transform, and descriptor failures
static:
  documents:
    - file: machine.yaml
      valid: true
    - file: target.yaml
      valid: true
    - file: transform-machine.yaml
      valid: true
    - file: transform-target.yaml
      valid: true
artifacts:
  documents:
    - file: source-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: migration-descriptor.json
      kind: migration_descriptor
      valid: true
    - file: transform-source-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: transform-fault-descriptor.json
      kind: migration_descriptor
      valid: true
    - file: unsupported-descriptor-format.json
      kind: migration_descriptor
      valid: false
      error: unsupported_migration_descriptor_format
    - file: legacy-0.0.6-snapshot.json
      kind: migration_descriptor
      valid: false
      error: unsupported_migration_descriptor_format
    - file: unsupported-descriptor-schema-version.json
      kind: migration_descriptor
      valid: false
      error: unsupported_migration_descriptor_schema_version
persistence_vectors:
  - name: missing_maintenance_mode_is_invalid_request
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - migration-descriptor.json
    migration_request:
      target_validated_bundle_fingerprint: sha256:eeec154ca64b619fe802af811b942073a2bc988b669429d7d08748dd72ab6cfc
      migration_route:
        - sha256:4275074e701103214e66a937345d706e81ccde303a295d8fba85cd873f546125
    expect:
      result: failure
      code: invalid_migration_request
      caller_still_owns_aggregate: true
  - name: target_definition_is_unavailable
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
    migration_descriptors:
      - migration-descriptor.json
    migration_route:
      - sha256:4275074e701103214e66a937345d706e81ccde303a295d8fba85cd873f546125
    target_validated_bundle_fingerprint: sha256:eeec154ca64b619fe802af811b942073a2bc988b669429d7d08748dd72ab6cfc
    maintenance_mode: false
    expect:
      result: failure
      code: target_definition_unavailable
      caller_still_owns_aggregate: true
  - name: non_boolean_maintenance_mode_is_invalid_request
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - migration-descriptor.json
    migration_request:
      target_validated_bundle_fingerprint: sha256:eeec154ca64b619fe802af811b942073a2bc988b669429d7d08748dd72ab6cfc
      migration_route:
        - sha256:4275074e701103214e66a937345d706e81ccde303a295d8fba85cd873f546125
      maintenance_mode: not-a-boolean
    expect:
      result: failure
      code: invalid_migration_request
      caller_still_owns_aggregate: true
  - name: runtime_transform_fault
    operation: migrate_aggregate
    aggregate_state: transform-source-aggregate-state.json
    definitions:
      - transform-machine.yaml
      - transform-target.yaml
    migration_descriptors:
      - transform-fault-descriptor.json
    migration_route:
      - sha256:90ad464e966182e9633e2beee85acc613570b73f813eb0997fe6fcd87055590d
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: failure
      code: migration_transform_fault
      caller_still_owns_aggregate: true
  - name: unsupported_descriptor_discriminator
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:

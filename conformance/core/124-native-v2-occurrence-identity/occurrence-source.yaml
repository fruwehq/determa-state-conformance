format: 1
namespace: conformance.persistence_occurrence_local
events:
  spawn_worker:
    direction: input
    payload:
      value: { type: int, required: true }
  clear_reference:
    direction: input
  reenter:
    direction: input
machines:
  - machine_id: owner
    version: 1
    root:
      variables:
        child_reference:
          type: instance_reference
          machine_id: worker
          nullable: true
          init: null
        pending_value: { type: int, init: 0 }
      on_events:
        spawn_worker:
          action:
            - assign:
                pending_value: event.payload.value
            - spawn:
                machine_id: worker
                bindings:
                  input:
                    seed: pending_value
                bind_to: child_reference
        clear_reference:
          action:
            - assign: { child_reference: "null" }
  - machine_id: worker
    version: 1
    root:
      type: composite
      variables:
        seed: { type: int, input: true }
      initial: { transition_to: active }
      states:
        active:
          variables:
            value: { type: int, init: 0 }
          entry:
            - assign: { value: seed }
          on_events:
            reenter: { transition_to: active }

title: history changes only when its owning composite exits
steps:
  - send: { event: change_descendant }
    expect:
      config: [second]
      history: { work: null }

  - send: { event: leave }
    expect:
      config: [outside]
      history: { work: [second] }

  - send: { event: resume }
    expect:
      config: [second]

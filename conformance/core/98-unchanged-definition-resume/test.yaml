title: restored state dispatches exactly as uninterrupted state under the same definition
static:
  documents:
    - file: machine.yaml
      valid: true
artifacts:
  documents:
    - file: source-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: expected-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: expected-aggregate-state.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: expected-aggregate-state.json
    - file: input-envelope.json
      kind: json_value
      valid: true
    - file: expected-emissions.json
      kind: json_value
      valid: true
persistence_vectors:
  - name: restore_then_dispatch
    operation: restore_and_dispatch
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
    input_envelope: input-envelope.json
    expect:
      result: success
      disposition: handled
      aggregate_state_file: expected-aggregate-state.json
      canonical_bytes_file: expected-aggregate-state.canonical.json
      emissions_file: expected-emissions.json

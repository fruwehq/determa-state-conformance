title: identical migration retries reproduce bytes and failures never retain intermediate
  candidates
static:
  documents:
    - file: machine.yaml
      valid: true
    - file: target.yaml
      valid: true
artifacts:
  documents:
    - file: source-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: expected-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: expected-aggregate-state.canonical.json
      kind: aggregate_state
      valid: true
      canonical_of: expected-aggregate-state.json
    - file: migration-descriptor.json
      kind: migration_descriptor
      valid: true
    - file: expected-migration-audit.json
      kind: json_value
      valid: true
    - file: invalid-migration-descriptor.json
      kind: migration_descriptor
      valid: true
persistence_vectors:
  - name: identical_retry
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - migration-descriptor.json
    migration_route:
      - sha256:3603b7728993290dc9db52dc3577498b70c241ab9458ef444af27148ba160085
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: success
      aggregate_state_file: expected-aggregate-state.json
      exact_bytes_file: expected-aggregate-state.canonical.json
      migration_audit_file: expected-migration-audit.json
    repeat_count: 2
  - name: identical_failed_retry
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - invalid-migration-descriptor.json
    migration_route:
      - sha256:2a19e6426b57520febc487cf154ad20f3b541ad723e7dbef64b486660ccf6104
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    repeat_count: 2
    expect:
      result: failure
      code: migration_totality_failure
      caller_still_owns_aggregate: true

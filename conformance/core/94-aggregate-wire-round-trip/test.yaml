persistence_vectors:
  - name: created_aggregate_matches_wire
    operation: serialize_created_aggregate
    source_bundle: machine.yaml
    creation:
      machine_id: job
      root_instance_id: job-42
      creation_id: create-1
      bindings: {}
    expect:
      result: success
      aggregate_state_file: source-aggregate-state.json
      exact_bytes_file: source-aggregate-state.canonical.json
  - name: faulted_aggregate_round_trip
    operation: restore_and_serialize
    aggregate_state: faulted-aggregate-state.json
    definitions:
      - machine.yaml
    expect:
      result: success
      aggregate_state_file: faulted-aggregate-state.json
      exact_bytes_file: faulted-aggregate-state.canonical.json
  - name: all_typed_values_round_trip

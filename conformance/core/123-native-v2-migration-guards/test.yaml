    covers:
      - untrusted_descriptor
    operation: migrate_aggregate_v2
    request_file: operation-inputs.json
    request_pointer: /untrusted_descriptor
    state_before: limits-source-aggregate-v2.json
    descriptor_file: limits-descriptor-v2.json
    expect:
      result: failure
      code: migration_descriptor_untrusted
      unchanged_file: limits-source-aggregate-v2.json

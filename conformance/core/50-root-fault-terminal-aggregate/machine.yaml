format: 1
namespace: conformance.case_50_root_fault_terminal_aggregate
events:
  start:
    direction: input
  fault_root:
    direction: input
  advance:
    direction: input
machines:
  - machine_id: parent
    root:
      type: composite
      variables:
        child_reference:
          type: instance_reference
          machine_id: child
          nullable: true
          init: null
        value: { type: int, init: 1 }
      initial: { transition_to: running }
      states:
        running:
          on_events:
            start:
              action:
                - spawn:
                    machine_id: child
                    bind_to: child_reference
            fault_root:
              action:
                - assign: { value: "value / 0" }
  - machine_id: child
    root:
      type: composite
      variables:
        advances: { type: int, init: 0 }
      initial: { transition_to: waiting }
      states:
        waiting:
          on_events:
            advance:
              action:
                - assign: { advances: "advances + 1" }

  - name: faulted_component_step_rejection
    covers: [faulted_component_step_rejection]
    operation: step_v2
    bundle: component-machine.yaml
    state_before: faulted-component-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /faulted_component_step
    expect: { result: success, exact_result_file: faulted-component-step-result.json }
  - name: disposed_component_step_rejection
    covers: [disposed_component_step_rejection]
    operation: step_v2
    bundle: component-machine.yaml
    state_before: disposed-component-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /disposed_component_step
    expect: { result: success, exact_result_file: disposed-component-step-result.json }
  - name: completed_component_admission_rejection
    covers: [completed_component_admission_rejection]

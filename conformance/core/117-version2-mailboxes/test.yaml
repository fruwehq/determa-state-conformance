    - { file: invalid-core-step-result-v2.json, kind: core_step_result_v2, valid: false, error: invalid_core_step_result }
    - { file: operation-inputs.json, kind: version2_operation_inputs, valid: true }
    - { file: admission-success.json, kind: version2_operation_result, valid: true }
    - { file: replay-success.json, kind: version2_operation_result, valid: true }
    - { file: invalid-version2-operation-result.json, kind: version2_operation_result, valid: false, error: invalid_version2_operation_result }
version2_vectors:
  - name: create_empty_queue_bearing_aggregate
    covers:
      - aggregate_v2_schema_positive_negative
      - canonical_v2_bytes_and_digests
      - capacity_unbounded
      - root_mailbox_isolation
      - version2_counter_allocation
    operation: create_v2
    bundle: machine.yaml
    request_file: operation-inputs.json
    request_pointer: /create
    expect: { result: success, exact_result_file: empty-aggregate-v2.json }
  - name: admit_ordered_batch
    covers:
      - mailbox_location_totality
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /admit_two
    expect: { result: success, exact_result_file: admission-success.json }
  - name: duplicate_batch_is_atomic
    covers: [batch_duplicate_rejection]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /duplicate_batch
    expect:
      result: failure
      code: duplicate_event_id_in_batch
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: digest_mismatch_batch_is_atomic
    covers: [delivery_digest_rejection]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /digest_mismatch_batch
    expect:
      result: failure
      code: delivery_digest_mismatch
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: host_cause_must_equal_event_identity
    covers: [host_cause_identity_rejection]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /host_cause_mismatch
    expect:
      result: failure
      code: invalid_delivery_source
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: undeclared_event_batch_is_atomic
    covers: [invalid_event_batch_atomic_rejection]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /undeclared_event_batch
    expect:
      result: failure
      code: invalid_event
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: wrong_payload_batch_is_atomic
    covers: [invalid_payload_batch_atomic_rejection]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /wrong_payload_batch
    expect:
      result: failure
      code: invalid_payload
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: pending_identity_replay
    covers: [equal_pending_replay]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /equal_replay
    expect: { result: success, exact_result_file: replay-success.json }
  - name: pending_identity_conflict
    covers: [conflicting_pending_replay]
    operation: admit_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /conflicting_replay
    expect:
      result: failure
      code: event_id_conflict
      unchanged_file: base-aggregate.json
      caller_still_owns_input: true
  - name: explicit_step_recall
    covers:
      - automatic_selective_recall
      - explicit_target_single_step
      - fifo_recall_to_ready_tail
      - fresh_queue_sequence_on_recall
      - mailbox_envelope_identity_preserved
    operation: step_v2
    bundle: machine.yaml
    state_before: base-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /recall_step
    expect: { result: success, exact_result_file: handled-recall-result.json }
  - name: recalled_event_can_defer_again
    covers: [reclassification_and_repeated_deferral]
    operation: step_v2
    bundle: machine.yaml
    state_before: repeated-before.json
    request_file: operation-inputs.json
    request_pointer: /repeated_step
    expect: { result: success, exact_result_file: repeated-deferral-result.json }
  - name: empty_ready_mailbox
    covers: [deferred_only_not_runnable]

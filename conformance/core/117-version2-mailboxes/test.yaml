    state_before: faulted-component-aggregate.json
    request_file: operation-inputs.json
    request_pointer: /faulted_component_admit
    expect: { result: failure, code: inactive_component_target, unchanged_file: faulted-component-aggregate.json, caller_still_owns_input: true }
  - name: disposed_component_admission_rejection

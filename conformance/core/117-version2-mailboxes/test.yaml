    request_file: operation-inputs.json
    request_pointer: /completed_component_admit
    expect: { result: failure, code: inactive_component_target, unchanged_file: completed-component-aggregate.json, caller_still_owns_input: true }
  - name: faulted_component_admission_rejection
    covers: [faulted_component_admission_rejection]
    operation: admit_v2

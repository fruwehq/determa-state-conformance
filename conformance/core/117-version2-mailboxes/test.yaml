    request_pointer: /completed_root_admit
    expect: { result: failure, code: invalid_instance_target, unchanged_file: completed-root-aggregate.json, caller_still_owns_input: true }
  - name: deterministic_deferral_overflow
    covers:
      - capacity_zero_and_overflow_fault
      - fault_frozen_mailbox_retention
    operation: step_v2
    bundle: zero-capacity-machine.yaml
    state_before: zero-capacity-before.json
    request_file: operation-inputs.json
    request_pointer: /overflow_step
    expect: { result: success, exact_result_file: overflow-result.json }
  - name: internal_emission_to_active_target
    covers: [core_step_v2_schema_positive_negative, internal_emission_active_target]
    operation: step_v2
    bundle: component-machine.yaml
    state_before: lifecycle-before.json

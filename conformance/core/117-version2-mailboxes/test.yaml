title: queue-bearing aggregate version 2 mailboxes and one-step execution
static:
  documents:
    - { file: machine.yaml, valid: true }
    - { file: component-machine.yaml, valid: true }
    - { file: spawn-machine.yaml, valid: true }
    - { file: zero-capacity-machine.yaml, valid: true }
artifacts:
  documents:
    - { file: base-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: base-aggregate.canonical.json, kind: aggregate_state_v2, valid: true, canonical_of: base-aggregate.json }
    - { file: empty-aggregate-v2.json, kind: aggregate_state_v2, valid: true }
    - { file: deferred-only-aggregate-v2.json, kind: aggregate_state_v2, valid: true }
    - { file: repeated-before.json, kind: aggregate_state_v2, valid: true }

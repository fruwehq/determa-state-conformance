    - { file: component-isolation-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: component-isolation-result.json, kind: core_step_result_v2, valid: true }
    - { file: completed-component-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: completed-component-step-result.json, kind: core_step_result_v2, valid: true }
    - { file: faulted-component-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: faulted-component-step-result.json, kind: core_step_result_v2, valid: true }
    - { file: disposed-component-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: disposed-component-step-result.json, kind: core_step_result_v2, valid: true }
    - { file: spawn-isolation-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: spawn-isolation-result.json, kind: core_step_result_v2, valid: true }
    - { file: invalid-aggregate-v2.json, kind: aggregate_state_v2, valid: false, error: invalid_aggregate_state }
    - { file: invalid-canonical-order-aggregate-v2.json, kind: aggregate_state_v2, valid: false, error: invalid_aggregate_state }
    - { file: handled-recall-result.json, kind: core_step_result_v2, valid: true }
    - { file: repeated-deferral-result.json, kind: core_step_result_v2, valid: true }
    - { file: not-runnable-result.json, kind: core_step_result_v2, valid: true }
    - { file: invalid-target-result.json, kind: core_step_result_v2, valid: true }
    - { file: completed-root-aggregate.json, kind: aggregate_state_v2, valid: true }
    - { file: completed-root-step-result.json, kind: core_step_result_v2, valid: true }
    - { file: overflow-result.json, kind: core_step_result_v2, valid: true }
    - { file: lifecycle-before.json, kind: aggregate_state_v2, valid: true }
    - { file: retained-faulted-before.json, kind: aggregate_state_v2, valid: true }
    - { file: cancellation-before.json, kind: aggregate_state_v2, valid: true }
    - { file: natural-completion-before.json, kind: aggregate_state_v2, valid: true }
    - { file: aggregate-completion-before.json, kind: aggregate_state_v2, valid: true }
    - { file: cleanup-rollback-before.json, kind: aggregate_state_v2, valid: true }
    - { file: reserved-event-before.json, kind: aggregate_state_v2, valid: true }
    - { file: reserved-event-handled-result.json, kind: core_step_result_v2, valid: true }
    - { file: internal-emission-active-result.json, kind: core_step_result_v2, valid: true }
    - { file: internal-emission-retained-faulted-result.json, kind: core_step_result_v2, valid: true }
    - { file: internal-emission-cancelled-result.json, kind: core_step_result_v2, valid: true }
    - { file: internal-emission-runtime-completed-result.json, kind: core_step_result_v2, valid: true }
    - { file: internal-emission-aggregate-completed-result.json, kind: core_step_result_v2, valid: true }

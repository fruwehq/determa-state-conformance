format: 1
namespace: conformance.case_09_parallel_components
events:
  fanout:
    direction: input
  finish_left:
    direction: input
  finish_right:
    direction: input
  enter_faulty:
    direction: input
  cancel_after_send:
    direction: input
  cleanup_rollback:
    direction: input
  aggregate_finish:
    direction: input
  component_work:
    direction: internal
  component_finish:
    direction: internal
machines:
  - machine_id: parallel_components
    version: 1
    root:
      type: composite
      initial: { transition_to: processing }
      states:
        processing:
          type: parallel
          on_events:
            fanout:
              action:
                - send:
                    event: component_work
                    targets:
                      - { component: left }
                      - { component: right }
            finish_left:
              action:
                - send:
                    event: component_finish
                    to: { component: left }
            finish_right:
              action:
                - send:
                    event: component_finish
                    to: { component: right }
            cancel_after_send:
              action:
                - send:
                    event: component_work
                    to: { component: left }
              transition_to: finished
            done: { transition_to: finished }
            determa.component_completed: {}
          components:
            - component_id: left
              root:
                type: composite
                variables:
                  trace: { type: list, init: [] }
                initial: { transition_to: running }
                states:
                  running:
                    on_events:
                      component_work:
                        action:
                          - assign: { trace: "trace + ['left']" }
                      component_finish:
                        action:
                          - send:
                              event: component_work
                              to: { self: true }
                        transition_to: complete
                  complete: { type: final }
            - component_id: right
              root:
                type: composite
                variables:
                  trace: { type: list, init: [] }
                initial: { transition_to: running }
                states:
                  running:
                    on_events:
                      component_work:
                        action:
                          - assign: { trace: "trace + ['right']" }
                      component_finish:
                        action:
                          - send:
                              event: component_work
                              to: { self: true }
                        transition_to: complete
                  complete: { type: final }
        finished: { type: final }
        cleanup_failed:
          type: parallel
          on_events:
            cleanup_rollback:
              action:
                - send:
                    event: component_work
                    to: { component: retained }
              transition_to: finished
          exit:
            - assign: { cleanup_marker: "1 / 0" }
          variables:
            cleanup_marker: { type: int, init: 0 }
          components:
            - component_id: retained
              root: {}
            - component_id: retained_peer
              root: {}
        faulty_processing:
          type: parallel
          entry:
            - send:
                event: component_work
                to: { component: faulty }
          components:
            - component_id: faulty
              root:
                variables:
                  count: { type: int, init: 0 }
                entry:
                  - assign: { count: "'invalid'" }
            - component_id: observer
              root: {}
      on_events:
        enter_faulty: { transition_to: faulty_processing }
        aggregate_finish:
          action:
            - send:
                event: component_work
                to: { self: true }
            - stop: {}

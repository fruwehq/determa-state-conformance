format: 1
namespace: conformance.case_02_hierarchy_bubbling
events:
  tick:
    direction: input
  reset:
    direction: input
machines:
  - machine_id: bubbling
    version: 1
    root:
      type: composite
      initial: {transition_to: outer}
      states:
        outer:
          type: composite
          initial: {transition_to: a}
          on_events:
            reset: {transition_to: outer} # handled at the composite, not the leaf
          states:
            a:
              on_events:
                tick: {transition_to: b}
            b: {}                          # b has no handler for reset

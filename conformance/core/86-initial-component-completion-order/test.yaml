title: the last component initialization emits completed immediately before parallel done
steps:
  - send: { event: start }
    expect:
      status: running
      disposition: handled
      config: [processing]
      components:
        first: { status: completed, config: [], variables: {} }
        second: { status: completed, config: [], variables: {} }
      emissions:
        - event: determa.component_completed
          event_id: sha256:fd0e898181eef4b7398663a5ba524afd6bf92109e7435275b8039f2feed81370
          target: owner
          payload: { component_id: first }
        - event: determa.component_completed
          event_id: sha256:0bc71ddd79e6763c42b6696ed88aa51eebf65944712d641a2520d1f5be59c477
          target: owner
          payload: { component_id: second }
        - event: done
          event_id: sha256:d05b5b1c85dce77df7942164e3f025d7c4392150ec013d8098f34de8bca38762
          target: owner
          payload:
            relationship: parallel
            state_path: processing

version2_vectors:
  - name: explicit_leaf_remap
    covers:
      - explicit_leaf_remap
    operation: migrate_aggregate_v2
    request_file: operation-inputs.json
    request_pointer: /explicit_leaf_remap
    state_before: active-source-aggregate-v2.json
    descriptor_file: active-descriptor-v2.json
    expect:
      result: success
      exact_result_file: active-explicit_leaf_remap-result.json
  - name: missing_active_state_mapping
    covers:
      - missing_active_state_mapping
    operation: migrate_aggregate_v2
    request_file: operation-inputs.json
    request_pointer: /missing_active_state_mapping
    state_before: deleted-source-aggregate-v2.json
    descriptor_file: deleted-missing-active-state-mapping.json
    expect:
      result: failure
      code: migration_totality_failure
      unchanged_file: deleted-source-aggregate-v2.json
  - name: ambiguous_active_state_mapping
    covers:
      - ambiguous_active_state_mapping
    operation: migrate_aggregate_v2
    request_file: operation-inputs.json
    request_pointer: /ambiguous_active_state_mapping
    state_before: deleted-source-aggregate-v2.json
    descriptor_file: deleted-ambiguous-active-state-mapping.json
    expect:
      result: failure
      code: invalid_migration_descriptor
      unchanged_file: deleted-source-aggregate-v2.json

title: deleted active state migration never guesses or accepts partial mapping
static:
  documents:
    - file: machine.yaml
      valid: true
    - file: target.yaml
      valid: true
artifacts:
  documents:
    - file: source-aggregate-state.json
      kind: aggregate_state
      valid: true
    - file: missing-active-state-mapping.json
      kind: migration_descriptor
      valid: true
    - file: ambiguous-active-state-mapping.json
      kind: migration_descriptor
      valid: true
    - file: partial-variable-mapping.json
      kind: migration_descriptor
      valid: true
    - file: guessed-reset.json
      kind: migration_descriptor
      valid: true
persistence_vectors:
  - name: missing_active_state_mapping
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - missing-active-state-mapping.json
    migration_route:
      - sha256:2a19e6426b57520febc487cf154ad20f3b541ad723e7dbef64b486660ccf6104
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: failure
      code: migration_totality_failure
      caller_still_owns_aggregate: true
  - name: ambiguous_active_state_mapping
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - ambiguous-active-state-mapping.json
    migration_route:
      - sha256:b369abdc5e34e970cde1c7bc23b68ccff3ee50329aa5c2d98289cf771a78ce80
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: failure
      code: invalid_migration_descriptor
      caller_still_owns_aggregate: true
  - name: partial_variable_mapping
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - partial-variable-mapping.json
    migration_route:
      - sha256:64b0acf287976807c5f38fdf192765a72ddf3e25dd04d15ef0c26534ee459a1e
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: failure
      code: migration_totality_failure
      caller_still_owns_aggregate: true
  - name: guessed_reset
    operation: migrate_aggregate
    aggregate_state: source-aggregate-state.json
    definitions:
      - machine.yaml
      - target.yaml
    migration_descriptors:
      - guessed-reset.json
    migration_route:
      - sha256:c18856073906e68907f37def219e6ac4fa744a34d0efd09b8a42ab1b860a59f1
    target_validated_bundle_fingerprint: sha256:230f530b5f5d751df82aa7368863dc6ce6083bcb3a0f2ab7a48b695ad2a424ab
    maintenance_mode: false
    expect:
      result: failure
      code: migration_totality_failure
      caller_still_owns_aggregate: true

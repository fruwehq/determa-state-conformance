format: 1
namespace: conformance.case_55_root_owner_target
events:
  try_owner:
    direction: input
  ping:
    direction: internal
machines:
  - machine_id: root_owner_target
    root:
      type: composite
      initial: { transition_to: running }
      states:
        running:
          on_events:
            try_owner:
              action:
                - send:
                    event: ping
                    to: { owner: true }

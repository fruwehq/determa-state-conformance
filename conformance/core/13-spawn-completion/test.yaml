title: a spawned child completes and notifies its owner through reserved done
steps:
  - send: { event: start }
    expect:
      config: [idle]
      variables:
        child_reference: { instance_reference: { machine_id: child, targetable: true } }
      owned_instances:
        - key: { owner: root, spawn_sequence: 0 }
          machine_id: child
          status: running
          config: [running]

  - send: { bound_instance: child_reference, event: go }
    capture_emissions_as: child_completion
    expect:
      owned_instances: []
      variables:
        child_reference: { instance_reference: { machine_id: child, targetable: false } }
      emissions:
        - event: final_entered
          target: external
          correlation_id: child-completion-1
        - event: child_exited
          target: external
          correlation_id: child-completion-1
        - { event: done, target: owner }

  - deliver: { captured: child_completion, index: 2 }
    expect:
      config: [idle]
      variables:
        completed_children: 1
        spawned_identity_seen: true
        child_reference: { instance_reference: { machine_id: child, targetable: false } }

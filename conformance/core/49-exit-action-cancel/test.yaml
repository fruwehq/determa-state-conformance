title: an exit-action cancel is harmless after automatic child cleanup
steps:
  - send: { event: spawn_worker }
    expect:
      config: [holding]
      owned_instances:
        worker_reference: { machine_id: worker, status: running }

  # Automatic cleanup disposes the child before holding.exit runs. The exit-action
  # cancel therefore sees a disposed reference and must be a no-op.
  - send: { event: leave }
    expect:
      status: running
      disposition: handled
      config: [outside]
      owned_instances: {}
      fault: null
      emissions:
        - event: worker_disposed
          target: external
          correlation_id: worker-cleanup

  - send: { event: return_to_holding }
    expect:
      config: [holding]
      variables:
        worker_reference: null

  # The same exit action is also harmless when no child was spawned.
  - send: { event: leave }
    expect:
      status: running
      disposition: handled
      config: [outside]
      owned_instances: {}
      fault: null
      emissions: []

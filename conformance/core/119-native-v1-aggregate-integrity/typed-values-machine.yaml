format: 1
namespace: conformance.persistence_typed_values
machines:
  - machine_id: values
    version: 1
    root:
      type: simple
      variables:
        null_reference:
          type: instance_reference
          machine_id: worker
          nullable: true
          init: null
        boolean_value: { type: bool, init: true }
        integer_value: { type: int, init: -9223372036854775808 }
        float_value: { type: float, init: -0.0 }
        string_value: { type: string, init: text }
        list_value: { type: list, init: [1, 2.0, value] }
        map_value:
          type: map
          init: { z: 1, a: false }
  - machine_id: worker
    version: 1
    root: { type: simple }

format: 1
namespace: conformance.case_17_fault_handled
events:
  boom:
    direction: input
machines:
  - machine_id: faulty
    version: 1
    root:
      type: composite
      variables:
        x: {type: int, init: 7}
      on_events:
        error: {transition_to: recovered} # reserved fault event, handled here
      initial: {transition_to: ok}
      states:
        ok:
          on_events:
            boom:
              action: [assign: {x: "x / 0"}]       # division by zero -> CEL runtime error
        recovered: {}

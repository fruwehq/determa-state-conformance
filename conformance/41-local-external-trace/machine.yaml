format: 1
namespace: conformance.case_41_local_external_trace
events:
  preserve_source:
    direction: input
  reset_source:
    direction: input
machines:
  - machine_id: local_external_trace
    version: 1
    root:
      type: composite
      variables:
        trace: { type: list, init: [] }
      initial: { transition_to: container }
      states:
        container:
          type: composite
          entry:
            - assign: { trace: "trace + ['enter_container']" }
          exit:
            - assign: { trace: "trace + ['exit_container']" }
          initial: { transition_to: leaf }
          on_events:
            preserve_source:
              transition_to: container.leaf
              local: true
            reset_source:
              transition_to: container.leaf
          states:
            leaf:
              entry:
                - assign: { trace: "trace + ['enter_leaf']" }
              exit:
                - assign: { trace: "trace + ['exit_leaf']" }

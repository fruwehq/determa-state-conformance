format: 1
namespace: conformance.case_19_contract_pass
events:
  configure:
    direction: input
  make:
    direction: input
machines:
  - machine_id: prov
    version: 1
    contracts: [prov_contract]
    root:
      type: composite
      initial: {transition_to: unconfigured}
      states:
        unconfigured:
          on_events:
            configure: {transition_to: ready}
        ready:
          on_events:
            make:
              action: [spawn: {def: worker}]
  - machine_id: worker
    version: 1
    root:
      type: composite
      initial: {transition_to: w}
      states:
        w: {}

format: 1
namespace: conformance.case_18_fault_unhandled
events:
  boom:
    direction: input
machines:
  - machine_id: faultyun
    version: 1
    root:
      type: composite
      variables:
        x: {type: int, init: 7}
      initial: {transition_to: ok}     # no `error` handler anywhere
      states:
        ok:
          on_events:
            boom:
              action: [assign: {x: "x / 0"}]       # division by zero -> CEL runtime error

format: 1
namespace: conformance.case_13_spawn_completion
events:
  start:
    direction: input
  go:
    direction: input
machines:
  - machine_id: parent
    version: 1
    root:
      type: composite
      variables:
        child_reference:
          type: instance_reference
          machine_id: child
          nullable: true
          init: null
        completed_children: { type: int, init: 0 }
      initial: { transition_to: idle }
      on_events:
        done:
          guard: "event.payload.relationship == 'spawned_instance'"
          action:
            - assign: { completed_children: "completed_children + 1" }
      states:
        idle:
          on_events:
            start:
              action:
                - spawn:
                    machine_id: child
                    bind_to: child_reference
  - machine_id: child
    version: 1
    root:
      type: composite
      initial: { transition_to: running }
      states:
        running:
          on_events:
            go: { transition_to: complete }
        complete: { type: final }

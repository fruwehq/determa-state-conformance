format: 1
namespace: conformance.case_14_subscription
events:
  spawn2:
    direction: input
  ping: {direction: input, scope: local}
  pong: {direction: input, payload: {from: {type: string}}, scope: local}
machines:
  - machine_id: hub
    version: 1
    root:
      type: composite
      variables:
        pongs: {type: int, init: 0}
      on_events:
        pong:
          action: [assign: {pongs: "pongs + 1"}]       # internal
      initial: {transition_to: ready}
      states:
        ready:
          on_events:
            spawn2:
              action:
                - spawn: {def: worker}
                - spawn: {def: worker}
            ping:
              action: [publish: {event: ping}]       # undirected -> subscribers in scope

  - machine_id: worker
    version: 1
    subscribe: [ping]             # opt in to ping delivered over the bus
    root:
      type: composite
      initial: {transition_to: w}
      states:
        w:
          on_events:
            ping:
              action: [publish: {event: pong, to: parent, payload: {from: "id"}}]

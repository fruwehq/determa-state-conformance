format: 1
namespace: conformance.case_20_contract_fail
events:
  configure:
    direction: input
machines:
  - machine_id: badprov
    version: 1
    contracts: [prov_contract]
    root:
      type: composite
      initial: {transition_to: unconfigured}
      states:
        unconfigured:
          on_events:
            configure: {transition_to: ready}
        ready: {}        # never handles `make`, never spawns `worker`

name: Validate conformance fixtures

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out conformance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check out pinned specification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: fruwehq/determa-state-spec
          ref: 86bb88dd21cb1f799eefe5020b6e49dabf6e7225
          path: .determa-state-spec
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/validation-requirements.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement scripts/validation-requirements.txt

      - name: Validate fixture sources and schema results
        run: >-
          python scripts/validate_conformance.py
          --spec-root .determa-state-spec

      - name: Check merged specification goldens
        run: >-
          python scripts/test_spec_goldens.py
          --spec-root .determa-state-spec

      - name: Test closed-code registry validation
        run: python scripts/test_closed_code_registry.py

      - name: Test durable-host relational validation
        run: python scripts/test_durable_host_validator.py

      - name: Test application-projection relational validation
        run: python scripts/test_application_projection_validator.py

      - name: Test version-1 substitution-free validation
        run: python scripts/test_version1_validator.py

      - name: Check generated closed-code vectors
        run: python scripts/closed_code_registry.py --check

      - name: Check generated version-1 fixtures
        run: python scripts/generate_version1_vectors.py --check

      - name: Check generated extension negotiation fixtures
        run: >-
          python scripts/generate_extension_negotiation_profile.py
          --spec-root .determa-state-spec --check

      - name: Check generated host authority fixtures
        run: >-
          python scripts/generate_host_authority_profile.py
          --spec-root .determa-state-spec --check

      - name: Test host authority relational validation
        run: python scripts/test_host_authority_validator.py --spec-root .determa-state-spec

      - name: Install Rust provider test toolchain
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Test extension negotiation relational validation
        env:
          RUSTUP_TOOLCHAIN: "1.86.0"
        run: >-
          python scripts/test_extension_negotiation_validator.py
          --spec-root .determa-state-spec

      - name: Check generated durable-host fixtures
        run: python scripts/generate_execution_checkpoint_profile.py --check

      - name: Check generated application-projection fixtures
        run: python scripts/generate_application_projection_profile.py --check

      - name: Check portable archive profile and adversarial validation
        run: |
          python scripts/generate_portable_archive_profile.py --spec-root .determa-state-spec --check
          python scripts/test_portable_archive_validator.py --spec-root .determa-state-spec
      - name: Test inspection relational validation
        run: python scripts/test_inspection_validator.py

      - name: Check generated inspection fixtures
        run: python scripts/generate_inspection_vectors.py --check

      - name: Check generated optional inspection provider fixtures
        run: python scripts/generate_inspection_provider_profile.py --check

      - name: Test exact runtime provider source and relational validation
        run: >-
          python scripts/test_runtime_provider_validator.py
          --spec-root .determa-state-spec

      - name: Check generated runtime provider fixtures
        run: >-
          python scripts/generate_runtime_provider_profile.py
          --spec-root .determa-state-spec --check

      - name: Check generated committed native effect fixtures
        run: >-
          python scripts/generate_committed_native_effects_profile.py
          --spec-root .determa-state-spec --check

      - name: Test committed native effect relational and adapter gates
        run: >-
          python scripts/test_committed_native_effects_validator.py
          --spec-root .determa-state-spec

      - name: Test Rust native effect handler source
        run: >-
          rustc --test
          conformance/profiles/committed-native-effects/effect-01-result/handler/test_handler.rs
          -o /tmp/determa-effect-handler-test && /tmp/determa-effect-handler-test

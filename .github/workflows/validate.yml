name: Validate conformance fixtures

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out conformance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check out pinned specification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: fruwehq/determa-state-spec
          ref: ee38796d5e38e67e350a06548fd50faa530cbb12
          path: .determa-state-spec
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/validation-requirements.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement scripts/validation-requirements.txt

      - name: Validate fixture sources and schema results
        run: >-
          python scripts/validate_conformance.py
          --spec-root .determa-state-spec

      - name: Test closed-code registry validation
        run: python scripts/test_closed_code_registry.py

      - name: Test durable-host relational validation
        run: python scripts/test_durable_host_validator.py

      - name: Test version-2 substitution-free validation
        run: python scripts/test_version2_validator.py

      - name: Check generated closed-code vectors
        run: python scripts/closed_code_registry.py --check

      - name: Check generated version-2 fixtures
        run: python scripts/generate_version2_vectors.py --check

      - name: Check generated durable-host fixtures
        run: python scripts/generate_execution_checkpoint_profile.py --check
